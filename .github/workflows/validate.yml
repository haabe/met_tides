name: Validate

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Weekly, to catch new hassfest/HACS rules before users hit them
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The integration lives at the repo root (HACS content_in_root), but
      # hassfest expects custom_components/<domain>/ and also scans the root,
      # so move the files rather than copy them.
      - name: Stage integration under custom_components/
        run: |
          mkdir -p custom_components/met_tides
          mv *.py manifest.json translations custom_components/met_tides/
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # brands/topics only matter for the HACS default store; installing as a
          # custom repository works without them. After adding repo topics
          # (e.g. home-assistant, hacs, integration), drop "topics" from here.
          ignore: brands topics
