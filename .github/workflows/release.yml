name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $version"
            exit 1
          fi
      - name: Build zip
        run: zip -r met_tides.zip *.py manifest.json translations
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" met_tides.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
