# Tooling config only; the integration itself is not a Python package.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["custom_components.met_tides"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "ASYNC",        # async pitfalls
  "SIM",          # simplifications
  "RUF",
  "PT",           # pytest style
]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tide_helpers"]
